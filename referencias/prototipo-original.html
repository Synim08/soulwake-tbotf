<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aventura del Valle: Incremental</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#ece8dc;--ink:#25232d;--mute:#66646e;--btn:#d9d4c4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141b;--ink:#ecebf2;--mute:#9b99a8;--btn:#2d2a3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15141b;--ink:#ecebf2;--mute:#9b99a8;--btn:#2d2a3a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box}
canvas{width:712px;max-width:calc(100% - 8px);height:auto;border:4px solid var(--ink);border-radius:6px;background:#000;touch-action:none;display:block}
.hint{margin:0;color:var(--mute);font-size:13px;text-align:center;max-width:60ch}
#pad{display:none;width:100%;max-width:360px;justify-content:space-between;align-items:center}
@media(hover:none){#pad{display:flex}}
.dp{display:grid;grid-template:repeat(3,52px)/repeat(3,52px);gap:2px}
button{background:var(--btn);color:var(--ink);border:2px solid var(--ink);border-radius:10px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.foot{background:none;border:none;color:var(--mute);font-size:12px;text-decoration:underline;padding:4px;cursor:pointer}.u{grid-area:1/2}.l{grid-area:2/1}.r{grid-area:2/3}.d{grid-area:3/2}
.ok{width:76px;height:76px;border-radius:50%;font:700 22px system-ui}
</style>
</head>
<body>
<canvas id="c" width="480" height="352" role="img" aria-label="Juego de rol Aventura del Valle"></canvas>
<p class="hint">Muévete con las flechas o WASD. Espacio o Enter para hablar y elegir. Contrata ayudantes con el mercader para ganar monedas sin parar. Tu progreso se guarda solo.</p>
<button class="foot" id="wipe" type="button">Borrar partida</button>
<div id="pad">
  <div class="dp">
    <button class="u" data-k="u" aria-label="Arriba">▲</button>
    <button class="l" data-k="l" aria-label="Izquierda">◀</button>
    <button class="r" data-k="r" aria-label="Derecha">▶</button>
    <button class="d" data-k="d" aria-label="Abajo">▼</button>
  </div>
  <button class="ok" data-k="ok" aria-label="Aceptar">A</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
X.scale(2,2);
const T=16,W=48,H=33,DX=[0,1,0,-1],DY=[-1,0,1,0],F='8px "Press Start 2P",monospace';
const rn=n=>Math.floor(Math.random()*n);
let seed=11;const sr=()=>(seed=seed*16807%2147483647)/2147483647;

/* ---------- Mapa ---------- */
const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>x*y==0||x==W-1||y==H-1?'T':'.'));
const rect=(a,b,c,d,t)=>{for(let y=b;y<=d;y++)for(let x=a;x<=c;x++)map[y][x]=t};
for(let i=0;i<240;i++)map[1+(sr()*(H-2)|0)][1+(sr()*(W-2)|0)]='T';
rect(3,2,19,11,'.');
for(let y=14;y<=20;y++)for(let x=2;x<=10;x++)if(((x-6)/4.5)**2+((y-17)/3.5)**2<1)map[y][x]='~';
rect(5,3,7,4,'H');rect(12,3,14,4,'H');
rect(4,7,18,7,'p');rect(16,7,16,11,'p');rect(16,11,26,11,'p');rect(26,9,26,11,'p');
rect(22,1,30,9,'r');rect(23,2,29,8,'c');map[9][26]='c';
rect(16,11,16,17,'p');rect(11,15,15,19,'.');rect(12,17,16,17,'p');
rect(26,11,38,11,'p');rect(38,11,38,15,'p');
rect(30,16,46,31,'r');rect(31,17,45,30,'x');rect(41,24,44,28,'L');rect(32,25,34,28,'L');map[16][38]='G';
const CH=[[18,3,'.'],[4,10,'.'],[20,18,'.'],[8,27,'.'],[24,24,'.'],[40,8,'.'],[29,3,'c'],[23,7,'c'],[36,20,'x'],[44,18,'x'],[33,29,'x']];
for(const [x,y,t] of CH)map[y][x]=t;

/* ---------- Enemigos y PNJ ---------- */
const TY={slime:{n:'Slime',hp:14,a:5,d:0,xp:8,g:4,c:'#5fd37a'},bat:{n:'Murciélago',hp:12,a:7,d:1,xp:12,g:6},boss:{n:'Rey Slime',hp:70,a:11,d:2,xp:60,g:50,c:'#2fae8f'},
  wolf:{n:'Lobo',hp:22,a:8,d:1,xp:14,g:8},skel:{n:'Esqueleto',hp:30,a:10,d:2,xp:20,g:12},
  golem:{n:'Gólem',hp:60,a:14,d:5,xp:40,g:30},ghost:{n:'Fantasma',hp:40,a:17,d:3,xp:45,g:34},
  dragon:{n:'Dragón Ancestral',hp:260,a:24,d:7,xp:300,g:400}};
const BOSS={boss:1,dragon:1};
const en=[];
const mk=(type,x,y)=>en.push({type,x,y,home:[x,y],alive:1,t:1,rs:0});
const sc=(type,n,ok)=>{for(let k=0;k<n;){const x=1+rn(W-2),y=1+rn(H-2);if(ok(x,y)&&!en.some(e=>e.x==x&&e.y==y)){mk(type,x,y);k++}}};
const vil=(x,y)=>x>2&&x<21&&y>1&&y<13;
sc('slime',10,(x,y)=>map[y][x]=='.'&&!vil(x,y)&&x<24&&y<20);
sc('wolf',8,(x,y)=>map[y][x]=='.'&&!vil(x,y)&&(x>=24||y>=20)&&!(x>29&&y>15));
sc('bat',4,(x,y)=>map[y][x]=='c'&&y>3);
sc('skel',3,(x,y)=>map[y][x]=='c'&&y>4);
sc('golem',4,(x,y)=>map[y][x]=='x'&&y>20);
sc('ghost',3,(x,y)=>map[y][x]=='x'&&y>18);
mk('boss',26,3);mk('dragon',38,29);
const npcs=[{x:9,y:6,k:'elder',rb:'#7a55c9',hr:'#eeeeee'},{x:13,y:6,k:'shop',rb:'#d99a2b',hr:'#7a4a22'},{x:12,y:16,k:'hermit',rb:'#2f8a7a',hr:'#cfd8dc'}];

/* ---------- Estado ---------- */
const P={x:10,y:7,px:160,py:112,dir:2,tx:0,ty:0,mv:0,lv:1,xp:0,hp:30,mhp:30,a:6,d:2,g:15,pot:1,mp:13};
let mode='title',q=[],qi=0,after=null,sel=0,B=null,quest=0,grace=0,tm=0,shopMsg='';
const held={};
const walk=(x,y)=>'.pcx'.includes(map[y]?.[x]);
const free=(x,y,pl)=>walk(x,y)&&!npcs.some(n=>n.x==x&&n.y==y)&&!CH.some(c=>c[0]==x&&c[1]==y)&&!en.some(e=>e.alive&&e.x==x&&e.y==y)&&(pl||!((P.x==x&&P.y==y)||(P.mv&&P.tx==x&&P.ty==y)));

/* ---------- Incremental: mejoras, ayudantes, renacer y guardado ---------- */
const SUF=['','K','M','B','T','Qa','Qi'];
const fmt=n=>{if(n<1000)return n<10&&n%1?n.toFixed(1):Math.floor(n)+'';const i=Math.min(SUF.length-1,Math.floor(Math.log10(n)/3));return (n/1000**i).toFixed(2)+SUF[i]};
const KEY='aventura-valle-incremental-v1',AR=[0,0,1,8,50,300,2000];
const S={l:[0,0,0,0,0,0,0],gems:0,cyc:0,sp:0,gu:[0,0,0,0],ch:[],k:{},q:0,gate:0};
let wiped=0,welcome='',sv=0,gs=0;
const gm=()=>1+.3*S.gems,gd=()=>gm()*(1+.25*S.gu[0]),mmp=()=>10+3*P.lv,rg=()=>3+S.cyc*2;
const inc=()=>{let s=0;for(let i=2;i<7;i++)s+=AR[i]*S.l[i]*2**(S.l[i]/10|0);return s*gd()};
const SH=[
  {n:'Poción',d:'Cura 20 PV durante un combate.',c:()=>10},
  {n:'Espada',d:'+2 de ataque permanente.',c:l=>Math.ceil(25*1.35**l),i:0},
  {n:'Armadura',d:'+1 de defensa permanente.',c:l=>Math.ceil(30*1.4**l),i:1},
  {n:'Minero',d:'Reúne 1 moneda por segundo por nivel. Se duplica cada 10 niveles.',c:l=>Math.ceil(40*1.15**l),i:2},
  {n:'Herrero',d:'Reúne 8 monedas por segundo por nivel. Se duplica cada 10 niveles.',c:l=>Math.ceil(300*1.15**l),i:3},
  {n:'Cazador',d:'Reúne 50 monedas por segundo por nivel. Se duplica cada 10 niveles.',c:l=>Math.ceil(2200*1.15**l),i:4},
  {n:'Alquimista',d:'Reúne 300 monedas por segundo por nivel. Se duplica cada 10 niveles.',c:l=>Math.ceil(15000*1.15**l),i:5},
  {n:'Grifo',d:'Reúne 2000 monedas por segundo por nivel. Se duplica cada 10 niveles.',c:l=>Math.ceil(120000*1.15**l),i:6},
  {n:'Salir',d:'Volver a la aventura.'}
];
const GS=[
  {n:'Fortuna',d:'+25% de monedas por nivel.',c:l=>2+l*2,i:0},
  {n:'Vigor',d:'+10 PV máximos por nivel.',c:l=>2+l*2,i:1},
  {n:'Fuerza',d:'+1 de ataque por nivel.',c:l=>2+l*2,i:2},
  {n:'Sabiduría',d:'+25% de experiencia por nivel.',c:l=>2+l*2,i:3},
  {n:'Salir',d:'Volver a la aventura.'}
];
const save=()=>{if(wiped)return;try{localStorage.setItem(KEY,JSON.stringify({P,S,quest,t:Date.now()}))}catch(e){}};
try{
  const d=JSON.parse(localStorage.getItem(KEY));
  if(d&&d.P&&d.S){
    Object.assign(P,d.P,{x:10,y:7,px:160,py:112,mv:0,dir:2});Object.assign(S,d.S);quest=d.quest|0;S.l=[...S.l,0,0].slice(0,7);if(S.gate)map[16][38]='x';
    const sec=Math.min((Date.now()-d.t)/1000,28800);
    if(sec>30&&inc()>0){const g=inc()*sec;P.g+=g;welcome='Mientras no estabas, tus ayudantes reunieron '+fmt(g)+' monedas.'}
  }
}catch(e){}
function rebirth(){
  S.gems+=rg();S.cyc++;S.l=[0,0,0,0,0,0,0];S.q=0;S.k={};S.ch=[];S.gate=0;map[16][38]='G';quest=1;
  const mh=30+10*S.gu[1];
  Object.assign(P,{x:10,y:7,px:160,py:112,mv:0,dir:2,lv:1,xp:0,hp:mh,mhp:mh,a:6+S.gu[2],d:2,g:15,pot:1,mp:13});
  for(const e of en){e.alive=1;e.x=e.home[0];e.y=e.home[1];e.rs=0}
  mode='play';grace=2;save();
}
const hit=(k,p)=>Math.max(1,Math.floor((P.a+rn(4))*gm()*k)-(p?0:B.t.d));
const SK=[
  {n:'Golpe',lv:1,c:4,f:()=>{const m=hit(2);B.hp-=m;B.fl=.25;B.msg='Golpe fuerte: '+m+' de daño.'}},
  {n:'Curar',lv:3,c:6,f:()=>{const h=Math.ceil(P.mhp*.4);P.hp=Math.min(P.mhp,P.hp+h);B.msg='Te curas '+h+' PV.'}},
  {n:'Fuego',lv:5,c:9,f:()=>{const m=hit(3,1);B.hp-=m;B.fl=.25;B.msg='Fuego: '+m+' de daño que ignora la defensa.'}},
  {n:'Rayo',lv:8,c:15,f:()=>{const m=hit(5,1);B.hp-=m;B.fl=.25;B.msg='Rayo: '+m+' de daño que ignora la defensa.'}}
];
const Q=[
  {d:'Derrota a 5 slimes.',f:()=>S.k.slime>=5,g:40,p:1},
  {d:'Derrota a 4 lobos.',f:()=>S.k.wolf>=4,g:120,p:1},
  {d:'Derrota al Rey Slime en la cueva.',f:()=>S.gate,g:300,p:2},
  {d:'Derrota a 5 esqueletos.',f:()=>S.k.skel>=5,g:900,p:2},
  {d:'Derrota a 5 gólems en las Ruinas.',f:()=>S.k.golem>=5,g:4000,p:3},
  {d:'Derrota al Dragón Ancestral en lo profundo de las Ruinas.',f:()=>0,g:0,p:0}
];
function skel(x,y,s){X.save();X.translate(x,y);X.scale(s,s);const e='#e8e4d8';col(e,5,1,6,6);col('#111',6,3,1,2);col('#111',9,3,1,2);col(e,7,7,2,5);col(e,4,8,8,1);col(e,4,10,8,1);col(e,5,12,2,3);col(e,9,12,2,3);X.restore()}
function wolf(x,y,s){X.save();X.translate(x,y);X.scale(s,s);const g='#8a8a96';col(g,3,7,10,5);col(g,10,4,5,5);col(g,11,2,2,3);col(g,1,6,3,2);col('#6a6a76',3,12,2,3);col('#6a6a76',10,12,2,3);col('#fff',13,5,1,1);col('#111',15,6,1,1);X.restore()}
function golem(x,y,s){X.save();X.translate(x,y);X.scale(s,s);col('#7a7e90',3,4,10,9);col('#5d6070',1,6,3,6);col('#5d6070',12,6,3,6);col('#9aa0b4',5,1,6,5);col('#ffcf4a',6,3,1,1);col('#ffcf4a',9,3,1,1);col('#5d6070',4,13,3,3);col('#5d6070',9,13,3,3);X.restore()}
function ghost(x,y,s){X.save();X.translate(x,y+Math.sin(tm*3)*2);X.scale(s,s);X.globalAlpha=.85;const g='#e8eaff';col(g,4,2,8,11);col(g,3,5,10,7);col(g,3,13,2,2);col(g,7,13,2,2);col(g,11,13,2,2);col('#222',6,6,1,3);col('#222',9,6,1,3);X.restore()}
function dragon(x,y,s){X.save();X.translate(x,y);X.scale(s,s);const r='#c43a2b';col('#8f2a20',1,1,4,7);col('#8f2a20',5,0,4,4);col(r,4,5,9,7);col(r,11,3,4,4);col(r,14,4,2,2);col(r,0,10,4,2);col(r,5,12,2,3);col(r,10,12,2,3);col('#f1efe8',11,1,1,2);col('#ffd24a',13,4,1,1);X.restore()}
const SP={bat,skel,wolf,golem,ghost,dragon};
function drawE(t,x,y,s){SP[t]?SP[t](x,y,s):slime(x,y,TY[t].c,s,t=='boss')}

/* ---------- Diálogos y tienda ---------- */
function say(l,f){mode='talk';q=l;qi=0;after=f||null}
function nextLine(){if(++qi>=q.length){mode='play';const f=after;after=null;f&&f()}}
function interact(){
  const c=CH.findIndex((c,i)=>!S.ch.includes(i)&&Math.abs(c[0]-P.x)+Math.abs(c[1]-P.y)==1);
  if(c>=0){
    S.ch.push(c);const g=Math.ceil(40*1.4**S.cyc*gd()*(1+c%3*.5)),p=Math.random()<.3?1:0;P.g+=g;P.pot+=p;
    return say(['Abres un cofre: +'+fmt(g)+' monedas'+(p?' y una poción.':'.')]);
  }
  const n=npcs.find(n=>Math.abs(n.x-P.x)+Math.abs(n.y-P.y)==1);if(!n)return;
  const rest=()=>{P.hp=P.mhp;P.mp=mmp()};
  if(n.k=='shop')return say(['Mercader: ¡Mejoro tu equipo y contrato ayudantes que te dan monedas sin parar!'],()=>{gs=0;mode='shop';sel=0;shopMsg=''});
  if(n.k=='hermit')return say(['Ermitaño: Las gemas guardan el poder de tus vidas pasadas.','Ermitaño: Gástalas aquí en mejoras que nunca se pierden al renacer.'],()=>{gs=1;mode='shop';sel=0;shopMsg=''});
  if(!quest)return say(['Anciano: ¡Bienvenido, joven aventurero!','Anciano: Un Rey Slime vive en la cueva del este y asusta a todo el valle.','Anciano: Gana experiencia con los monstruos y luego derrótalo. Toma esta poción.','Anciano: El mercader contrata ayudantes que te darán monedas incluso mientras exploras.'],()=>{quest=1;P.pot++});
  const q=Q[S.q];
  if(q.g&&q.f()){
    const g=Math.ceil(q.g*1.4**S.cyc*gd());P.g+=g;P.pot+=q.p;S.q++;
    say(['Anciano: ¡Misión cumplida! Toma '+fmt(g)+' monedas y '+q.p+' pociones.','Anciano: Nuevo encargo: '+Q[S.q].d],rest);
  }else say(['Anciano: Tu encargo: '+q.d,'Anciano: Descansa y recupera tus fuerzas.'],rest);
}
function shopAct(){
  const L=gs?GS:SH,it=L[sel];
  if(!it.c){mode='play';return}
  const l=it.i==null?0:gs?S.gu[it.i]:S.l[it.i],c=it.c(l),have=gs?S.gems-S.sp:P.g;
  if(have<c){shopMsg=gs?'No tienes gemas suficientes.':'No te alcanzan las monedas.';return}
  if(gs){S.sp+=c;S.gu[it.i]++;if(it.i==1){P.mhp+=10;P.hp+=10}if(it.i==2)P.a++}
  else{P.g-=c;if(it.i==null)P.pot++;else{S.l[it.i]++;if(it.i==0)P.a+=2;if(it.i==1)P.d++}}
  shopMsg='¡Comprado!';
}

/* ---------- Combate por turnos ---------- */
function start(e){mode='battle';P.mv=0;P.px=P.x*T;P.py=P.y*T;const b=TY[e.type],c=S.cyc,t={...b,hp:Math.ceil(b.hp*1.5**c),a:Math.ceil(b.a*1.25**c),d:b.d+c,xp:Math.ceil(b.xp*1.4**c),g:Math.ceil(b.g*1.4**c)};B={e,t,hp:t.hp,msg:'¡'+t.n+' te ataca!',sel:0,busy:0,def:0,fl:0,sh:0}}
function check(){if(grace>0||mode!='play')return;const e=en.find(e=>e.alive&&Math.abs(e.x-P.x)+Math.abs(e.y-P.y)<=1);e&&start(e)}
function bkey(a){
  if(B.busy)return;
  if(B.over){if(a=='ok')endB();return}
  const n=B.sub?SK.length+1:5;
  if(a=='u')B.sel=(B.sel+n-1)%n;
  if(a=='d')B.sel=(B.sel+1)%n;
  if(a=='l'&&B.sub){B.sub=0;B.sel=1;return}
  if(a!='ok')return;
  const s=B.sel;
  if(B.sub){
    if(s==SK.length){B.sub=0;B.sel=1;return}
    const k=SK[s];
    if(P.lv<k.lv){B.msg='Aprendes '+k.n+' en el nivel '+k.lv+'.';return}
    if(P.mp<k.c){B.msg='No tienes PM suficientes.';return}
    P.mp-=k.c;B.sub=0;B.def=0;k.f();
  }else{
    if(s==1){B.sub=1;B.sel=0;return}
    B.def=0;
    if(s==0){const m=hit(1);B.hp-=m;B.fl=.25;B.msg='Atacas y causas '+m+' de daño.'}
    if(s==2){B.def=1;B.msg='Te cubres con el escudo.'}
    if(s==3){if(!P.pot){B.msg='No te quedan pociones.';return}P.pot--;P.hp=Math.min(P.mhp,P.hp+20);B.msg='Bebes una poción y recuperas 20 PV.'}
    if(s==4){if(BOSS[B.e.type]){B.msg='¡No puedes huir de '+B.t.n+'!';return}if(Math.random()<.6){B.msg='¡Escapaste!';B.over=1;return}B.msg='No lograste escapar.'}
  }
  if(B.hp<=0)return win();
  B.busy=1;setTimeout(foe,750);
}
function foe(){
  let m=Math.max(1,B.t.a+rn(3)-P.d);if(B.def)m=Math.max(1,m>>1);
  P.hp-=m;P.mp=Math.min(mmp(),P.mp+2);B.sh=.25;B.msg=B.t.n+' te hace '+m+' de daño.';
  if(P.hp<=0){P.hp=0;B.msg='Has caído... Despertarás en el pueblo.';B.over=1;B.lost=1}
  B.busy=0;
}
function win(){
  const t=B.t;B.over=1;B.won=1;B.e.alive=0;B.e.rs=25;S.k[B.e.type]=(S.k[B.e.type]|0)+1;const g=Math.ceil(t.g*gd()),x=Math.ceil(t.xp*(1+.25*S.gu[3]));P.xp+=x;P.g+=g;
  let s='¡Ganaste! +'+fmt(x)+' XP, +'+fmt(g)+' monedas.';
  while(P.xp>=P.lv*20){P.xp-=P.lv*20;P.lv++;P.mhp+=8;P.a+=2;P.d++;P.hp=P.mhp;P.mp=mmp();s+=' ¡Nivel '+P.lv+'!'}
  if(Math.random()<.25){P.pot++;s+=' Hallas una poción.'}
  B.msg=s;
}
function endB(){
  if(B.lost)Object.assign(P,{x:10,y:7,px:160,py:112,hp:P.mhp,g:Math.floor(P.g*.75)});
  mode=B.won&&B.e.type=='dragon'?'end':'play';grace=2;
  if(B.won&&B.e.type=='boss'){S.gate=1;map[16][38]='x';say(['¡El Rey Slime cae! Un estruendo abre la puerta de las Ruinas, al sureste.'])}
}

/* ---------- Entrada ---------- */
function press(a){
  if(mode=='title'){if(a=='ok'){mode='play';if(welcome){say([welcome]);welcome=''}}}
  else if(mode=='talk'){if(a=='ok')nextLine()}
  else if(mode=='shop'){if(a=='u'||a=='d'){{const n=(gs?GS:SH).length;sel=(sel+(a=='u'?n-1:1))%n}shopMsg=''}else if(a=='ok')shopAct()}
  else if(mode=='battle')bkey(a);
  else if(mode=='end'){if(a=='ok')rebirth()}
  else if(a=='ok')interact();
}
const KM={arrowup:'u',w:'u',arrowdown:'d',s:'d',arrowleft:'l',a:'l',arrowright:'r',d:'r',' ':'ok',enter:'ok',e:'ok'};
addEventListener('keydown',e=>{const a=KM[e.key.toLowerCase()];if(!a)return;e.preventDefault();if(!held[a]){held[a]=1;press(a)}});
addEventListener('keyup',e=>{const a=KM[e.key.toLowerCase()];if(a)held[a]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0});
addEventListener('pagehide',save);document.addEventListener('visibilitychange',save);
const wb=document.getElementById('wipe');let wa=0;
wb.onclick=()=>{if(!wa){wa=1;wb.textContent='¿Seguro? Pulsa de nuevo';setTimeout(()=>{wa=0;wb.textContent='Borrar partida'},3500)}else{wiped=1;try{localStorage.removeItem(KEY)}catch(e){}location.reload()}};
C.addEventListener('pointerdown',()=>{window.focus();if(['title','end','talk'].includes(mode))press('ok')});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!held[k]){held[k]=1;press(k)}});
  ['pointerup','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{held[k]=0}));
});

/* ---------- Actualización ---------- */
function update(dt){
  tm+=dt;if(grace>0)grace-=dt;if(mode!='title')P.g+=inc()*dt;if((sv+=dt)>5){sv=0;save()}
  if(B){B.fl=Math.max(0,B.fl-dt);B.sh=Math.max(0,B.sh-dt)}
  if(mode!='play')return;
  if(P.mv){
    const tx=P.tx*T,ty=P.ty*T,dx=tx-P.px,dy=ty-P.py,d=Math.hypot(dx,dy),s=80*dt;
    if(d<=s){P.px=tx;P.py=ty;P.x=P.tx;P.y=P.ty;P.mv=0;check()}else{P.px+=dx/d*s;P.py+=dy/d*s}
  }
  if(!P.mv&&mode=='play'){
    const d=held.u?0:held.d?2:held.l?3:held.r?1:-1;
    if(d>=0){P.dir=d;const nx=P.x+DX[d],ny=P.y+DY[d];if(free(nx,ny,1)){P.tx=nx;P.ty=ny;P.mv=1}}
  }
  for(const e of en){
    if(!e.alive){
      e.rs-=dt;
      if(e.rs<=0&&!BOSS[e.type]&&Math.abs(e.home[0]-P.x)+Math.abs(e.home[1]-P.y)>4){e.alive=1;e.x=e.home[0];e.y=e.home[1]}
      continue;
    }
    if(BOSS[e.type]||(e.t-=dt)>0)continue;
    e.t=.7+Math.random()*.7;
    let d=rn(4);const dx=P.x-e.x,dy=P.y-e.y;
    if(Math.abs(dx)+Math.abs(dy)<6&&Math.random()<.6)d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
    const nx=e.x+DX[d],ny=e.y+DY[d];
    if(Math.abs(nx-e.home[0])+Math.abs(ny-e.home[1])<=6&&free(nx,ny)){e.x=nx;e.y=ny;check();if(mode!='play')break}
  }
}

/* ---------- Dibujo ---------- */
const col=(c,x,y,w,h)=>{X.fillStyle=c;X.fillRect(x,y,w,h)};
const tt=(s,x,y,c)=>{X.fillStyle=c||'#f1efe8';X.fillText(s,x,y)};
function txt(s,x,y,w,lh,c){
  X.fillStyle=c||'#f1efe8';let l='';
  for(const wd of s.split(' ')){const t=l?l+' '+wd:wd;if(X.measureText(t).width>w&&l){X.fillText(l,x,y);y+=lh;l=wd}else l=t}
  X.fillText(l,x,y);
}
const box=(x,y,w,h)=>{col('#f1efe8',x-2,y-2,w+4,h+4);col('#17151f',x,y,w,h)};
const bar=(x,y,w,f,c)=>{col('#000',x-1,y-1,w+2,6);col(c,x,y,Math.max(0,w*f),4)};

function tile(c,x,y,tx,ty){
  const v=(tx*7+ty*3)%5;
  if(c=='~'){col('#3a78c9',x,y,T,T);col('#6aa4e8',x+3+((tm*6|0)+tx)%4,y+5+v%3*3,5,1);return}
  if(c=='p'){col('#cfae78',x,y,T,T);if(v<2)col('#b8955d',x+v*5+2,y+9,3,2);return}
  if(c=='r'){col('#5d6070',x,y,T,T);col('#7a7e90',x+1,y+1,6,5);col('#7a7e90',x+8,y+8,6,6);return}
  if(c=='c'){col('#2d2a3a',x,y,T,T);if(v<2)col('#3d3950',x+v*6+3,y+8,3,2);return}
  if(c=='x'){col('#8a7f6a',x,y,T,T);if(v<2)col('#756b58',x+v*6+2,y+9,4,2);return}
  if(c=='L'){col('#d9442b',x,y,T,T);col('#f5a742',x+3+((tm*5|0)+tx)%5,y+4+v%3*3,4,2);return}
  if(c=='G'){col('#5d6070',x,y,T,T);col('#2b2b38',x+2,y+1,3,14);col('#2b2b38',x+7,y+1,3,14);col('#2b2b38',x+12,y+1,2,14);return}
  col('#6fb04a',x,y,T,T);
  if(c=='.'){if(v==0){col('#5a9a3c',x+4,y+9,1,3);col('#5a9a3c',x+10,y+4,1,3)}return}
  if(c=='T'){col('#6b4a2b',x+6,y+10,4,6);col('#2f7a3a',x+3,y+1,10,11);col('#2f7a3a',x+1,y+4,14,6);col('#43a04d',x+4,y+3,3,3);return}
  if(c=='H'){
    if(map[ty-1][tx]!='H'){col('#b24a3a',x,y,T,T);col('#8f382c',x,y+5,T,1);col('#8f382c',x,y+11,T,1)}
    else{col('#e8d6a6',x,y,T,T);if(tx==6||tx==13)col('#6b4a2b',x+4,y+4,8,12);else col('#6fb0e0',x+4,y+4,8,6)}
  }
}
function person(x,y,dir,st,rb,hr){
  const f=st%2;
  col('#00000044',x+3,y+14,10,2);
  col('#3a2a1e',x+5,y+13,2,3-f);col('#3a2a1e',x+9,y+13,2,2+f);
  col(rb,x+4,y+7,8,6);
  col('#f2c79b',x+4,y+2,8,6);
  col(hr,x+4,y+1,8,dir==0?6:3);
  if(dir==2){col('#222',x+6,y+5,1,1);col('#222',x+9,y+5,1,1)}
  if(dir==3)col('#222',x+5,y+5,1,1);
  if(dir==1)col('#222',x+10,y+5,1,1);
}
function slime(x,y,c,s,boss){
  X.save();X.translate(x,y);X.scale(s,s);
  const b=Math.sin(tm*4)>0?1:0;
  col(c,2,8+b,12,6-b);col(c,4,6+b,8,3);col('#ffffff66',5,7+b,2,2);
  col('#fff',5,9,2,3);col('#fff',9,9,2,3);col('#111',6,10,1,2);col('#111',10,10,1,2);
  if(boss){col('#f5d442',4,3,8,3);col('#f5d442',4,1,2,3);col('#f5d442',7,0,2,4);col('#f5d442',10,1,2,3)}
  X.restore();
}
function bat(x,y,s){
  X.save();X.translate(x,y);X.scale(s,s);
  const f=Math.sin(tm*12)>0?1:-1;
  col('#4a3a6a',5,6,6,6);col('#6a5a8a',0,5+f,5,3);col('#6a5a8a',11,5+f,5,3);
  col('#ff5b5b',6,8,1,1);col('#ff5b5b',9,8,1,1);col('#4a3a6a',5,4,2,2);col('#4a3a6a',9,4,2,2);
  X.restore();
}
const foeArt=(e,x,y,s)=>drawE(e.type,x,y,s);

function world(){
  const cx=Math.round(Math.min(Math.max(P.px+8-120,0),W*T-240)),cy=Math.round(Math.min(Math.max(P.py+8-88,0),H*T-176));
  for(let ty=cy/T|0;ty<=(cy+176)/T;ty++)for(let tx=cx/T|0;tx<=(cx+240)/T;tx++){const c=map[ty]?.[tx];if(c)tile(c,tx*T-cx,ty*T-cy,tx,ty)}
  for(const e of en)if(e.alive){
    const x=e.x*T-cx,y=e.y*T-cy;
    if(BOSS[e.type])drawE(e.type,x-4,y-8,1.5);else drawE(e.type,x,y,1);
  }
  for(const n of npcs){
    const x=n.x*T-cx,y=n.y*T-cy;person(x,y,2,0,n.rb,n.hr);
    if(n.k=='elder'&&(!quest||(Q[S.q].g&&Q[S.q].f()))){col('#f5d442',x+7,y-7,2,4);col('#f5d442',x+7,y-2,2,2)}
  }
  CH.forEach((c,i)=>{const x=c[0]*T-cx,y=c[1]*T-cy;
    if(S.ch.includes(i)){col('#8a5a2b',x+2,y+8,12,6);col('#a8713a',x+2,y+3,12,3);col('#f5d442',x+4,y+8,8,2)}
    else{col('#8a5a2b',x+2,y+7,12,7);col('#a8713a',x+2,y+5,12,3);col('#f5d442',x+7,y+7,2,4)}});
  const hx=P.px-cx,hy=P.py-cy;
  person(hx,hy,P.dir,P.mv?tm*8|0:0,'#3b6fd8','#5a3a1e');
  col('#dfe3ea',hx+(P.dir==3?2:13),hy+7,1,6);
}
function hud(){
  col('#000000aa',4,4,148,44);
  tt('Nv '+P.lv+'  PV '+P.hp+'/'+P.mhp,8,8);
  tt('Mon '+fmt(P.g)+' +'+fmt(inc())+'/s',8,19);
  tt('Poc '+P.pot+'  Gemas '+(S.gems-S.sp),8,30);
  col('#444',8,42,140,2);col('#f5d442',8,42,140*P.xp/(P.lv*20),2);
}
function battle(){
  X.save();
  if(B.sh>0)X.translate((tm*50|0)%2?2:-2,0);
  col('#1d1b2b',0,0,240,176);col('#2a2740',0,84,240,30);col('#00000055',64,96,112,8);
  const s=BOSS[B.e.type]?5:4;
  if(!(B.fl>0&&(tm*30|0)%2))foeArt(B.e,120-8*s,20+(s==5?4:0),s);
  tt(B.t.n,8,8);bar(8,20,100,B.hp/B.t.hp,'#e05555');
  tt('Nv '+P.lv+' PV '+P.hp+'/'+P.mhp,132,8);bar(132,20,100,P.hp/P.mhp,'#5fd37a');
  tt('PM '+P.mp+'/'+mmp()+' Poc '+P.pot,122,29,'#a9a6bb');
  box(6,112,228,60);
  txt(B.msg,12,118,134,11);
  if(B.over){if((tm*2|0)%2)col('#f5d442',214,160,6,4)}
  else if(!B.busy){const L=B.sub?SK.map(k=>k.n+(P.lv<k.lv?' Nv'+k.lv:' '+k.c)).concat('Volver'):['Atacar','Magia','Defender','Poción','Huir'];L.forEach((o,i)=>tt((B.sel==i?'> ':'  ')+o,146,118+i*10,B.sel==i?'#f5d442':'#f1efe8'))}
  X.restore();
}
function shop(){
  const L=gs?GS:SH;
  box(8,6,224,164);
  tt(gs?'Gemas: '+(S.gems-S.sp):'Mon '+fmt(P.g)+'  +'+fmt(inc())+'/s',14,12,gs?'#7fd6ff':'#f5d442');
  L.forEach((it,i)=>{
    const y=26+i*11,on=sel==i,l=it.i==null?0:gs?S.gu[it.i]:S.l[it.i],c=it.c?it.c(l):0;
    tt((on?'> ':'  ')+it.n+(it.i==null?'':' Nv'+l),14,y,on?'#f5d442':'#f1efe8');
    if(it.c){X.textAlign='right';tt(fmt(c),226,y,(gs?S.gems-S.sp:P.g)>=c?'#f1efe8':'#e05555');X.textAlign='left'}
  });
  txt(L[sel].d,14,130,208,10,'#a9a6bb');
  if(shopMsg)txt(shopMsg,14,158,208,10,'#f5d442');
}
function title(){
  col('#1d1b2b',0,0,240,176);col('#6fb04a',0,118,240,58);col('#cfae78',0,150,240,8);
  X.font='16px "Press Start 2P",monospace';
  tt('AVENTURA',56,22,'#f5d442');tt('DEL VALLE',48,46,'#f5d442');
  X.font=F;
  X.save();X.translate(64,66);X.scale(4,4);person(0,0,2,0,'#3b6fd8','#5a3a1e');X.restore();
  slime(130,62,TY.slime.c,4);
  if((tm*2|0)%2)tt('Espacio o toca para jugar',20,138,'#17151f');
}
function endScr(){
  col('#000000cc',0,0,240,176);
  X.font='16px "Press Start 2P",monospace';tt('¡VICTORIA!',40,34,'#f5d442');X.font=F;
  txt('Derrotaste al Dragón Ancestral. Renace con +'+rg()+' gemas: cada una suma 30% de daño y monedas, pero los monstruos serán más fuertes.',20,64,200,12);
  if((tm*2|0)%2)tt('Espacio o toca para renacer',28,150,'#a9a6bb');
}
function draw(){
  X.font=F;X.textBaseline='top';
  if(mode=='title')return title();
  if(mode=='battle')return battle();
  world();hud();
  if(mode=='talk'){box(8,112,224,56);txt(q[qi],14,119,212,11);if((tm*2|0)%2)col('#f5d442',220,160,6,4)}
  if(mode=='shop')shop();
  if(mode=='end')endScr();
}

let last=0;
function loop(t){const raw=(t-last)/1000||0,dt=Math.min(.05,raw);if(raw>5&&mode!='title')P.g+=inc()*Math.min(raw,28800);last=t;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
